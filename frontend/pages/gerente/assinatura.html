<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assinatura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/frontend/assets/css/styles.css" />
</head>

<body>

  <main class="frame" aria-label="Área principal">
    <section class="card" role="form" aria-labelledby="titulo-senha">
      <!-- Coluna esquerda -->
      <div>
        <div class="brand" aria-label="Identidade visual">
          <img class="flag" src="/frontend/assets/img/Petrobras_horizontal_logo.svg.png" alt="Logo Petrobras">
        </div>
        <h1 id="titulo-senha" class="title">Gerente teste</h1>
        <div class="email-display">
          <span class="email-icon"></span>
          <input id="userDisplay" type="text" readonly />
        </div>
      </div>

      <!-- Coluna direita -->
      <form class="form" id="passwordForm">
        <label class="field">
          <p>Confirma as informações presentes no relatório?</p>
          <span class="label">Assinar relatório</span>
          <input class="input" type="password" name="password" id="passwordInput" placeholder="••••••••"
            autocomplete="current-password" required />
        </label>

        <div class="showPassword">
          <input type="checkbox" id="togglePassword">
          <label for="togglePassword">Mostrar palavra-passe</label>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Validar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/frontend/assets/js/passwords.js"></script>
</body>

</html>
