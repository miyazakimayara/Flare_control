<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relatório</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/relatorio.css">
</head>
<body>
  
    <!-- header -->
    <header class="petrobras-header">
        <svg class="header-bg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <rect x="0" y="0" width="1000" height="1000" fill="#f9f9f9"/>
        <polygon fill="#D9D319"points="87,00  900,00  900,36  280,36  125,35" /> <!--- faixa amarela --->
        <polygon fill="#D9D319" points="850,10  970,97  1000,42  1000,0" /> <!--- “triângulo” amarelo da quina direita --->
        <polygon fill="#357C2E" points="800,0   1000,0   1000,15  855,83" /> <!--- triângulo verde, por cima do amarelo --->
        </svg>

        <!--- conteúdo do cabeçalho --->
        <div class="header-content">
        <img src="../assets/img/Petrobras_horizontal_logo.svg.png" alt="Petrobras" class="logo" /> <!--- logo --->
        
        <div class="dropdown"> <!--- ícone perfil + menu oculto --->
            <a class="profile-icon" title="Perfil do usuário" id="profileIcon" ><img id="profileIcon" src="../assets/img/user (1).svg" alt="ìcone do usuário"></a>
            <div class="profile-menu" id="profileMenu">
                <p class="profile-name">Fulano</p>
                <button class="profile-btn">
                <span onclick="window.location.href='perfil.html'" class="icon"><img src="../assets/img/user green.png"> Perfil</span> 
                </button>
                <button class="profile-btn">
                <span class="icon"><img src="../assets/img/exit green.png"> Sair </span>
                </button>
            </div>
        </div>
        </div>
        <hr>
    </header>
  
    <div class="main-content">
        <!--- trilha/caminho --->
        <div class="caminho"> 
            <a href="./home.html">Página inicial</a>
            <span>></span>
            <span id="caminho">Relatório diário</span>
            <span>></span>
            <span id="buscaRelatoio">dd/MM/yyyy</span>
        </div>

        <main class="page">
          <section class="relatorio-container">
            <!-- Barra verde com título -->
            <header class="relatorio-titulo">
              <p>Relatório de fechamento</p>
            </header>

            <!-- Cartão com busca e o relatório -->
            <div class="relatorio-card">
              <!-- Barra de busca -->
              <div class="busca">
                 <input type="text" placeholder="Jubarte; dd/MM/yyyy" aria-label="Buscar por plataforma e data"/> 
              </div>

              <!-- Linha da plataforma selecionada -->
              <div class="relatorio" onclick="window.location.href='relatorio.html'">
                <div class="dec"></div>
                 <div class="item-conteudo">
                     <span id="" class="relatorio-info">Jubarte</span>
                     <span id="" class="relatorio-info">dd/MM/yyyy</span>
                 </div>
              </div>

              <!-- Abrir o relatório -->
              <div class="exibir-relatorio">
                <div class="informacoes">
                    <div class="linha">
                      <div class="campo">
                        <span class="titulo">Volume da queima:</span>
                        <span class="valor">{{ volume_queima }}</span>
                      </div>
                      <div class="campo">
                        <span class="titulo">Categoria da queima:</span>
                        <span class="valor">{{ categoria_queima }}</span>
                      </div>
                    </div>

                    <div class="linha">
                      <div class="campo">
                        <span class="titulo">Data/hora início:</span>
                        <span class="valor">{{ data_inicio }}</span>
                      </div>
                      <div class="campo">
                        <span class="titulo">Data/hora término:</span>
                        <span class="valor">{{ data_termino }}</span>
                      </div>
                    </div>

                    <div class="linha">
                      <span class="titulo">Descrição:</span>
                      <div class="descricao">{{ descricao }}</div>
                    </div>
                    <hr>
                </div>

              </div>
            </div>
            
            <!-- Rodapé da página (voltar / baixar) -->
            <div class="rodape">
              <a href="home.html" class="link-voltar">
                <img src="/frontend/assets/img/voltar.png">  Voltar
              </a>
              <button class="btn-baixar"> 
                <img src="/frontend/assets/img/download.png">Baixar 
              </button>
            </div>

          </section>
        </main>
    </div>




  <script>
    const profileIcon = document.getElementById('profileIcon');
    const profileMenu = document.getElementById('profileMenu');

    profileIcon.addEventListener('click', function() {
      profileMenu.classList.toggle('show');
    });

    window.onclick = function(event) {
      if (!event.target.matches('#profileIcon') && !event.target.closest('.profile-menu')) {
        if (profileMenu.classList.contains('show')) {
          profileMenu.classList.remove('show');
        }
      }
    }
  </script>
  <script src="../assets/js/perfil.js"></script>
</body>
</html>
